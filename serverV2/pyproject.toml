[project]
name = "recall-api"
version = "0.1.0"
description = "A buffer-based note-taking API with AI-powered search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # FastAPI and web server
    "fastapi[standard]>=0.96.0",
    "uvicorn[standard]>=0.22.0",
    "gunicorn>=21.2.0",
    "pydantic>=1.10.11,<2.0.0",
    # Supabase
    "supabase>=1.0.3",
    "httpx>=0.24.1",
    # Vector database and embeddings
    "openai>=0.28.0",
    "numpy>=1.24.3",
    # LLM integrations
    "redis>=4.5.5",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.2",
    # Utilities
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-asyncio>=0.21.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "ruff>=0.0.272",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "B", "A", "C4", "UP"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
